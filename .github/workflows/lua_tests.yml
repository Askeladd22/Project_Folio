name: Lua regression tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  lua-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require version bump and changelog for every update
        env:
          CHECK_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHECK_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          python3 scripts/tests/test_versioning.py
          if [ -n "${CHECK_BASE_SHA}" ] && [ -n "${CHECK_HEAD_SHA}" ] &&
             [ "${CHECK_BASE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            python3 scripts/check_versioning.py --base-sha "${CHECK_BASE_SHA}" --head-sha "${CHECK_HEAD_SHA}"
          else
            python3 scripts/check_versioning.py
          fi
      - name: Install Lua runtimes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4 luajit lua-check love xvfb
      - name: Static lint of consolidated gameplay, event and persistence modules
        run: |
          luacheck --no-config --std lua51 --no-max-line-length \
            src/core/runtime_state.lua \
            src/core/engine_bridge.lua \
            src/farkle/rules.lua --globals love
      - name: Lua 5.4 syntax check (headless source and tests)
        run: |
          set -eu
          find src tests experiments -name '*.lua' -type f -print0 | xargs -0 -n 1 luac5.4 -p
          luac5.4 -p main.lua conf.lua lib/core.lua
      - name: Merchant table geometry contract (independent gate)
        run: |
          set -eu
          lua5.4 -e 'unpack=table.unpack' tests/hud/ui_v2_layout_contract_test.lua
          luajit tests/hud/ui_v2_layout_contract_test.lua
      - name: Lua 5.4 headless tests
        run: |
          set -eu
          for test in $(find tests -name '*_test.lua' | sort); do
            # GLB loader depends on LuaJIT FFI; the following LuaJIT step runs it.
            if [ "$test" = "tests/engine3d/glb_loader_test.lua" ]; then
              echo "SKIP under Lua 5.4: GLB loader requires LuaJIT FFI"
              continue
            fi
            echo "::group::$test"
            # The shipping LOVE runtime uses LuaJIT/5.1's global unpack.
            lua5.4 -e 'unpack=table.unpack' "$test"
            echo "::endgroup::"
          done
      - name: LuaJIT headless tests
        run: |
          set -eu
          for test in $(find tests -name '*_test.lua' | sort); do
            echo "::group::$test"
            luajit "$test"
            echo "::endgroup::"
          done
      - name: Bone dice GPU smoke (Mesa)
        env:
          PROJECT_FOLIO_BONE_DICE_SMOKE: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: timeout 60s xvfb-run -a love .
      - name: Merchant table interaction and composition (Mesa)
        env:
          MANUSCRIPT_FARKLE_HUD_SMOKE: '1'
          PROJECT_FOLIO_MERCHANT_REVIEW: '1'
          MANUSCRIPT_AUDIT_OUT: ${{ runner.temp }}/merchant-table
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          mkdir -p "$MANUSCRIPT_AUDIT_OUT"
          timeout 75s xvfb-run -a -s '-screen 0 1920x1080x24' love . ||
            { cat "$MANUSCRIPT_AUDIT_OUT/hud-smoke.log"; exit 1; }
          cat "$MANUSCRIPT_AUDIT_OUT/hud-smoke.log"
      - name: Save merchant table frames
        uses: actions/upload-artifact@v4
        with:
          name: merchant-table
          path: ${{ runner.temp }}/merchant-table/merchant-*.png
          if-no-files-found: error
      - name: Python source tests
        run: |
          set -eu
          python3 -m py_compile scripts/install_menu_art.py scripts/tests/test_menu_art_installer.py scripts/capture_ui_v2_baseline.py scripts/capture_ui_v2_review.py scripts/package_ui_v2_review.py scripts/tests/test_ui_v2_review.py scripts/tests/test_ui_v2_evidence.py scripts/run_smoke.py
          PYTHONPATH=. python3 scripts/tests/test_checkpoint.py
          PYTHONPATH=. python3 scripts/tests/test_capture_retention.py
          PYTHONPATH=scripts python3 scripts/tests/test_menu_art_installer.py
          PYTHONPATH=scripts python3 scripts/tests/test_ui_v2_review.py
          PYTHONPATH=scripts python3 scripts/tests/test_ui_v2_evidence.py
          PYTHONPATH=. python3 scripts/tests/test_love_runtime.py
