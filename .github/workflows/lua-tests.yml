name: Lua regression tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  lua-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua runtimes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4 luajit lua-check
      - name: Static lint of new pure gameplay, event and persistence modules
        run: |
          luacheck --no-config --std lua51 --no-max-line-length \
            src/core/settings_data_codec.lua \
            src/core/lua_table_store.lua \
            src/core/roll_events.lua \
            src/gameplay/farkle/commission_progress.lua --globals love
      - name: Lua 5.4 syntax check (headless source and tests)
        run: |
          set -eu
          find src tests experiments/g3d_lab experiments/physics_lab -name '*.lua' -type f -print0 | xargs -0 -n 1 luac5.4 -p
          luac5.4 -p main.lua core.lua conf.lua
      - name: Lua 5.4 headless tests
        run: |
          set -eu
          for test in tests/*_test.lua; do
            echo "::group::$test"
            # The shipping LOVE runtime uses LuaJIT/5.1's global unpack.
            lua5.4 -e 'unpack=table.unpack' "$test"
            echo "::endgroup::"
          done
      - name: LuaJIT headless tests
        run: |
          set -eu
          for test in tests/*_test.lua; do
            echo "::group::$test"
            luajit "$test"
            echo "::endgroup::"
          done
      - name: Build and smoke-test isolated native FPS lab
        run: |
          set -eu
          bash experiments/physics_lab/build-linux.sh
          luajit experiments/physics_lab/run.lua 8 450
          test -s experiments/physics_lab/build/results.csv
          luajit experiments/physics_lab/test_floor_guard.lua
          # Wider deterministic sample: 64 six-die rolls per solver.
          luajit experiments/physics_lab/run.lua 64 450 lab2 > experiments/physics_lab/build/lab2-ci.log
          grep -E '^(SUMMARY|CAUSES|GUARD|CSV:|NOTE:|WARNING:)' experiments/physics_lab/build/lab2-ci.log
          test -s experiments/physics_lab/build/results-lab2.csv
          test "$(wc -l < experiments/physics_lab/build/results-lab2.csv)" -eq 321
          luajit experiments/physics_lab/test_support.lua
          luajit experiments/physics_lab/run_support.lua 64 450 > experiments/physics_lab/build/lab3-ci.log
          grep '^SUPPORT ' experiments/physics_lab/build/lab3-ci.log
          test -s experiments/physics_lab/build/results-support.csv
          test "$(wc -l < experiments/physics_lab/build/results-support.csv)" -eq 321
          luajit experiments/physics_lab/run_contact_poses.lua
          test "$(wc -l < experiments/physics_lab/build/results-contact-poses.csv)" -eq 10
      - name: Python source tests
        run: |
          set -eu
          PYTHONPATH=. python3 scripts/test_checkpoint.py
          PYTHONPATH=. python3 scripts/test_capture_retention.py
          PYTHONPATH=. python3 scripts/test_love_runtime.py
