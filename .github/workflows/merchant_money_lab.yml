name: Merchant Duel V4 Venetian money lab
on:
  pull_request:
    paths:
      - 'experiments/merchant_wager_lab/**'
      - 'tests/labs/merchant_duel_money_test.lua'
      - '.github/workflows/merchant_money_lab.yml'
      - 'src/farkle/rules.lua'
  workflow_dispatch:

jobs:
  merchant-money:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua, LuaJIT and LÖVE
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4 luajit love xvfb
      - name: Parse V4 and unchanged V3 sources
        run: |
          for file in experiments/merchant_wager_lab/{main,duel,box,money_duel,currency,wager,money_log,money_simulate}.lua tests/labs/merchant_duel_money_test.lua; do
            luac5.4 -p "$file"
          done
      - name: Existing V3 and V4 rules — Lua 5.4
        run: |
          lua5.4 tests/labs/merchant_wager_v3_test.lua
          lua5.4 tests/labs/merchant_duel_money_test.lua
          lua5.4 -e "print((require('experiments.merchant_wager_lab.money_simulate').report(5,101)))"
      - name: Existing V3 and V4 rules — LuaJIT
        run: |
          luajit tests/labs/merchant_wager_v3_test.lua
          luajit tests/labs/merchant_duel_money_test.lua
      - name: Standalone UI smoke with software OpenGL
        env:
          MERCHANT_V4_SMOKE: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: timeout 40s xvfb-run -a -s '-screen 0 1280x720x24' love experiments/merchant_wager_lab
